name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compiler:
    name: compiler and language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -e .
      - name: unittest
        # the firmware suites (test_i386*, test_rv64) assemble binaries with
        # nasm and step an emulated CPU for minutes: they are the next job
        run: |
          python -m unittest -v \
            tests.test_anim3d tests.test_assets tests.test_canvas \
            tests.test_cli tests.test_codegen tests.test_console \
            tests.test_diagnostics tests.test_extension \
            tests.test_extension_naming tests.test_extensions \
            tests.test_grammar tests.test_include tests.test_language_rules \
            tests.test_lexer tests.test_microbit tests.test_numbers \
            tests.test_nvim tests.test_obfuscate tests.test_opcode_mapping \
            tests.test_parser tests.test_roundtrip \
            tests.test_roundtrip_regressions tests.test_sb3 tests.test_shapes

  firmware:
    name: i386 and rv64 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install nasm
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: build the images
        run: |
          make i386
      - name: i386
        run: |
          python -m unittest tests.test_i386 tests.test_i386_disk \
            tests.test_i386_net tests.test_i386_pxe
      - name: rv64
        run: |
          python -m unittest tests.test_rv64
