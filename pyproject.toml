[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jswc"
version = "0.1.0"
description = "JadenScript (.jsw) to TurboWarp / Scratch 3 (.sb3) compiler"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JS2Twrp contributors" }]
keywords = ["scratch", "turbowarp", "sb3", "compiler", "jsw"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.scripts]
jswc = "jswc.cli:main"

[tool.setuptools]
packages = ["jswc"]
